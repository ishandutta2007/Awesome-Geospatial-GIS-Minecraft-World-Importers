<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#05101a" />
    </linearGradient>

    <linearGradient id="voxelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="voxelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatVoxel {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(500px); opacity: 0; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    .floating-box {
      animation: floatVoxel 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-box-delay {
      animation: floatVoxel 7s ease-in-out infinite;
      animation-delay: -3s;
      transform-origin: center;
    }
    .pulsing-glow {
      animation: pulse 5s ease-in-out infinite;
    }
    .scanner {
      animation: scanline 8s linear infinite;
    }
    .contour-line {
      stroke-dasharray: 6 4;
      animation: dashCycle 15s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Ambient Glows (Kept Behind Foreground Text) -->
  <circle cx="200" cy="100" r="160" fill="#0284c7" opacity="0.22" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1020" cy="220" r="180" fill="#059669" opacity="0.20" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="600" cy="380" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />

  <!-- Animated Contour Lines (Topographic DEM Representation) -->
  <g opacity="0.25">
    <path class="contour-line" d="M -50 280 Q 200 180 500 290 T 1050 240 T 1250 310" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="contour-line" d="M -50 320 Q 250 220 580 340 T 1100 280 T 1250 350" fill="none" stroke="#34d399" stroke-width="1.8" />
    <path class="contour-line" d="M -50 360 Q 300 260 660 380 T 1150 320 T 1250 390" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Dynamic 3D Isometric Voxel Clusters (Representing Minecraft Elevation & Building Generation) -->
  <!-- Left Side Isometric Voxel Group -->
  <g class="floating-box" opacity="0.75">
    <!-- Voxel Block 1 -->
    <path d="M 80 160 L 120 138 L 160 160 L 120 182 Z" fill="#34d399" fill-opacity="0.8" />
    <path d="M 80 160 L 120 182 L 120 226 L 80 204 Z" fill="#059669" fill-opacity="0.85" />
    <path d="M 160 160 L 120 182 L 120 226 L 160 204 Z" fill="#047857" fill-opacity="0.95" />

    <!-- Voxel Block 2 (Stacked Elevation) -->
    <path d="M 120 116 L 160 94 L 200 116 L 160 138 Z" fill="#38bdf8" fill-opacity="0.85" />
    <path d="M 120 116 L 160 138 L 160 182 L 120 160 Z" fill="#0284c7" fill-opacity="0.85" />
    <path d="M 200 116 L 160 138 L 160 182 L 200 160 Z" fill="#0369a1" fill-opacity="0.95" />
  </g>

  <!-- Right Side Isometric Voxel Group -->
  <g class="floating-box-delay" opacity="0.75">
    <!-- Voxel Block 3 -->
    <path d="M 1040 140 L 1080 118 L 1120 140 L 1080 162 Z" fill="#818cf8" fill-opacity="0.8" />
    <path d="M 1040 140 L 1080 162 L 1080 206 L 1040 184 Z" fill="#4f46e5" fill-opacity="0.85" />
    <path d="M 1120 140 L 1080 162 L 1080 206 L 1120 184 Z" fill="#3730a3" fill-opacity="0.95" />

    <!-- Voxel Block 4 -->
    <path d="M 1000 184 L 1040 162 L 1080 184 L 1040 206 Z" fill="#34d399" fill-opacity="0.8" />
    <path d="M 1000 184 L 1040 206 L 1040 250 L 1000 228 Z" fill="#059669" fill-opacity="0.85" />
    <path d="M 1080 184 L 1040 206 L 1040 250 L 1080 228 Z" fill="#047857" fill-opacity="0.95" />
  </g>

  <!-- Horizontal Dynamic Scanning Laser Effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="scanner" />

  <!-- Center Foreground Content Container (Ensures 100% Legibility and High Contrast) -->
  <rect x="180" y="48" width="840" height="324" rx="20" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" opacity="0.85" />

  <!-- Foreground Category Chip -->
  <g transform="translate(600, 92)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
      🌍 GEOSPATIAL GIS ✕ MINECRAFT VOXEL WORLDS
    </text>
  </g>

  <!-- Foreground Title (Crystal Clear, High Contrast Gradient) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
    Awesome Geospatial &amp; Minecraft World Importers
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">
    Real-World DEM, LiDAR, OpenStreetMap &amp; Satellite Data to Playable 3D Worlds
  </text>

  <!-- Feature Pills / Chips in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: DEM Elevation -->
    <g transform="translate(-320, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">⛰️ DEM &amp; LiDAR</text>
    </g>

    <!-- Pill 2: OpenStreetMap -->
    <g transform="translate(-160, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🗺️ OpenStreetMap</text>
    </g>

    <!-- Pill 3: Anvil .MCA & NBT -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🧱 Anvil .MCA / NBT</text>
    </g>

    <!-- Pill 4: 1:1 Scale Digital Twins -->
    <g transform="translate(165, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fb7185">🏙️ 1:1 Scale Cities</text>
    </g>

    <!-- Pill 5: Cloud GIS & Web-Viewers -->
    <g transform="translate(325, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#eab308" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#facc15">🛰️ Cloud GIS &amp; 3D</text>
    </g>
  </g>

  <!-- Status Footer in Foreground -->
  <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    ⚡ Arnis • QGIS • GDAL • Cuberite • BlueMap • Amulet • Overviewer • Placemark • PDAL • Chunky • WorldPainter
  </text>
</svg>
